[package]
name = "yorha-trainer"
version = "0.1.0"
edition = "2021"
description = "Single-player trainer for NieR:Automata (Steam): auto-collect without the chip, bigger pickup range, enemy respawn and a higher item stack limit"
authors = ["Oz Vessalius (@Silhatote)"]
license = "MIT"
repository = "https://github.com/Silhatote/yorha-trainer"

[dependencies]
# OpenGL (glow) instead of wgpu: much less memory, and the app only draws 2D.
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
image = { version = "0.25", default-features = false, features = ["webp", "jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }

# The icon and version info inside the executable.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
